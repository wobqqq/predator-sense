# DKMS configuration for the patched Linuwu-Sense driver bundled with
# predator-sense.
#
# With this registered, the module is rebuilt automatically whenever a new
# kernel is installed, so ./install.sh no longer has to be re-run after every
# kernel upgrade.

PACKAGE_NAME="linuwu-sense"
PACKAGE_VERSION="1.0.0"

# obj-m is `src/linuwu_sense.o`, so kbuild leaves the built module in src/.
BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

# Call kbuild directly rather than the Makefile's `all` target: that target also
# runs a `sudo` MOK-signing block, which cannot work from the unattended
# post-kernel-install hook. DKMS signs modules itself when Secure Boot is on
# (see /etc/dkms/framework.conf).
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Rebuild for every newly installed kernel.
AUTOINSTALL="yes"
