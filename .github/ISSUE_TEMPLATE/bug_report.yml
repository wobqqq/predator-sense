name: Bug report
description: A command or the installer does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A security issue (the sudoers helper, permissions) is reported privately, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got.
      render: shell
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Laptop model
      placeholder: Acer Predator PT316-51s
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel and distro
      placeholder: 7.2.7-200.fc44.x86_64, Fedora 44
    validations:
      required: true
  - type: textarea
    id: dkms
    attributes:
      label: Output of `dkms status linuwu-sense` and `lsmod | grep -E 'linuwu|acer'`
      render: shell
